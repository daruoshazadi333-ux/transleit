<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ترجمیار - مترجم آنلاین</title>
<meta name="description" content="مترجم آنلاین رایگان با بیش از ۱۰۰ زبان">
<meta name="theme-color" content="#6750A4">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">

<!-- ========== هدر ========== -->
<header class="main-header">
  <div class="container">
    <div class="header-content">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5h9M8.5 3v2M6 5c0 4 3 7 7 8M12 5c-.6 3-2.7 5.4-5.5 6.8M13 21l4-9 4 9M14.5 18h5"/>
        </svg>
        <span>ترجمیار</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn ripple" id="themeToggle" aria-label="تغییر تم">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        </button>
        <button class="icon-btn ripple" id="menuBtn" aria-label="منو">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</header>

<!-- ========== منوی کشویی ========== -->
<div class="drawer-scrim" id="drawerScrim"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5h9M8.5 3v2M6 5c0 4 3 7 7 8M12 5c-.6 3-2.7 5.4-5.5 6.8M13 21l4-9 4 9M14.5 18h5"/>
      </svg>
      <span>ترجمیار</span>
    </div>
    <p>مترجم آنلاین رایگان</p>
  </div>
  <nav class="drawer-list">
    <a class="drawer-item ripple" href="#">
      <span class="drawer-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      </span>
      <span class="drawer-text">
        <strong>پشتیبانی</strong>
        <span>ارتباط با ما</span>
      </span>
    </a>
  </nav>
  <div class="drawer-footer">ترجمیار — نسخه ۲.۰</div>
</aside>

<!-- ========== محتوای اصلی ========== -->
<main class="main-content">

  <div class="container">

    <!-- نوار زبان -->
    <div class="lang-bar">
      <div class="lang-chip">
        <select id="sourceLang"></select>
      </div>
      <button class="swap-btn ripple" id="swapBtn" aria-label="جابه‌جایی">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 7h11l-3-3M17 17H6l3 3"/>
        </svg>
      </button>
      <div class="lang-chip">
        <select id="targetLang"></select>
      </div>
    </div>

    <!-- خطا -->
    <div class="error-banner" id="errorBanner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L14.7 3.86a2 2 0 00-3.4 0z"/></svg>
      <span id="errorText">مشکلی در ارتباط با سرویس ترجمه پیش آمد.</span>
    </div>

    <!-- جعبه متن مبدا -->
    <div class="text-card">
      <textarea id="sourceText" placeholder="متن را وارد کنید…" maxlength="5000"></textarea>
      <div class="card-toolbar">
        <div class="tools">
          <button class="tool-btn ripple" id="micBtn" title="ورودی صوتی">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z"/><path d="M19 11a7 7 0 01-14 0M12 18v3"/></svg>
          </button>
          <button class="tool-btn ripple" id="speakSourceBtn" title="خواندن متن">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M16 9a3.5 3.5 0 010 6M18.5 6.5a7 7 0 010 11"/></svg>
          </button>
          <button class="tool-btn ripple" id="clearBtn" title="پاک کردن">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6h14z"/></svg>
          </button>
        </div>
        <span class="char-count" id="sourceCharCount">۰ / ۵۰۰۰</span>
      </div>
    </div>

    <!-- جعبه متن مقصد -->
    <div class="text-card">
      <textarea id="targetText" placeholder="ترجمه اینجا نمایش داده می‌شود…" readonly></textarea>
      <div class="card-toolbar">
        <div class="tools">
          <button class="tool-btn ripple" id="speakTargetBtn" title="خواندن ترجمه">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M16 9a3.5 3.5 0 010 6M18.5 6.5a7 7 0 010 11"/></svg>
          </button>
          <button class="tool-btn ripple" id="copyBtn" title="کپی">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 01-1-1V4a1 1 0 011-1h10a1 1 0 011 1v1"/></svg>
          </button>
          <button class="tool-btn ripple" id="favBtn" title="علاقه‌مندی">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17.3l-5.8 3.4 1.5-6.6L2.5 9.8l6.7-.6L12 3l2.8 6.2 6.7.6-5.2 4.3 1.5 6.6z"/></svg>
          </button>
        </div>
        <span class="char-count" id="targetCharCount"></span>
      </div>
    </div>

    <!-- دکمه ترجمه -->
    <button class="translate-fill-btn ripple" id="translateBtn">
      <span class="spinner"></span>
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h9M8.5 3v2M6 5c0 4 3 7 7 8M12 5c-.6 3-2.7 5.4-5.5 6.8M13 21l4-9 4 9M14.5 18h5"/></svg>
      <span>ترجمه کن</span>
    </button>

    <div class="hint-row">میانبر <kbd>Ctrl</kbd> + <kbd>Enter</kbd></div>

    <!-- ====== تب‌ها ====== -->
    <div class="tabs">
      <button class="tab-btn active" data-view="translate">📝 ترجمه</button>
      <button class="tab-btn" data-view="history">📜 تاریخچه</button>
      <button class="tab-btn" data-view="favorites">⭐ علاقه‌مندی‌ها</button>
    </div>

    <!-- تاریخچه -->
    <section class="view active" id="view-translate"></section>

    <section class="view" id="view-history">
      <div class="list-empty" id="historyEmpty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 8v5l3 2M21 12a9 9 0 11-3.5-7.13"/><path d="M21 3v6h-6"/></svg>
        <p>هنوز ترجمه‌ای انجام نداده‌اید.</p>
      </div>
      <div id="historyList"></div>
      <button class="text-btn ripple" id="clearHistoryBtn" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6h14z"/></svg>
        پاک کردن کل تاریخچه
      </button>
    </section>

    <!-- علاقه‌مندی‌ها -->
    <section class="view" id="view-favorites">
      <div class="list-empty" id="favEmpty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 17.3l-5.8 3.4 1.5-6.6L2.5 9.8l6.7-.6L12 3l2.8 6.2 6.7.6-5.2 4.3 1.5 6.6z"/></svg>
        <p>ترجمه‌های مورد علاقه‌تان را با ⭐ نگه دارید.</p>
      </div>
      <div id="favList"></div>
    </section>

  </div>
</main>

<!-- ========== اسنکبار ========== -->
<div class="snackbar" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="toastText">کپی شد</span>
</div>

<script src="script.js"></script>
</body>
</html>
